# ╔══════════════════════════════════════════╗
# ║         Kitty Config - CachyOS KDE      ║
# ╚══════════════════════════════════════════╝

# ── 字体 ──────────────────────────────────
font_family      Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5
#adjust_line_height  110%
adjust_column_width 0

# Hack 不含汉字，中日韩标点/汉字回退到 Maple Mono NF CN
symbol_map U+2E80-U+2EFF,U+2F00-U+2FDF,U+2FF0-U+2FFF,U+3000-U+303F,U+31C0-U+31EF,U+3200-U+32FF,U+3300-U+33FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FE10-U+FE1F,U+FE30-U+FE4F,U+FF00-U+FFEF,U+20000-U+2A6DF,U+2A700-U+2B73F,U+2B740-U+2B81F,U+2B820-U+2CEAF,U+2CEB0-U+2EBEF,U+30000-U+3134F Maple Mono NF CN

# 连字（按需开启，会略微增加渲染开销）
# font_features MesloLGMNerdFontMono-Regular +liga +calt

# ── 透明度 & 模糊 ──────────────────────────
# opacity: 0~1（越小越透）；blur: 0=关，>0 开启（Wayland/KDE 需合成器支持）
# 运行时可调透明度：kitty_mod+o = / - / 0
# 推荐：opacity 0.88 + blur 32 + Tokyo Night bg（#1a1b26）
background_opacity         0.88
background_blur            32
dynamic_background_opacity yes

# ── 光标 ──────────────────────────────────
cursor_shape           block
cursor_blink_interval  0.5
cursor_stop_blinking_after 10.0
cursor_beam_thickness  1.5

# ── 滚动 ──────────────────────────────────
scrollback_lines       10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# ── 性能 ──────────────────────────────────
repaint_delay   8
input_delay     2
sync_to_monitor yes

# ── URL ───────────────────────────────────
url_style           curly
open_url_with       default
url_prefixes        file ftp ftps git http https mailto news sftp ssh
detect_urls         yes
copy_on_select      clipboard

# ── 窗口布局 ──────────────────────────────
hide_window_decorations no
remember_window_size   no
initial_window_width   120c
initial_window_height  32c

window_padding_width   0
window_margin_width    0
single_window_margin_width -1

# 窗口边框（仅多窗口时显示）
draw_minimal_borders yes
window_border_width  1pt
# active_border_color  #7aa2f7
# inactive_border_color #292e42

# ── Tab 栏 ────────────────────────────────
tab_bar_edge           bottom
tab_bar_style          powerline
tab_powerline_style    slanted
tab_title_template     "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title[:20]}"
# active_tab_foreground  #16161e
# active_tab_background  #7aa2f7
# inactive_tab_foreground #545c7e
# inactive_tab_background #292e42
# tab_bar_background     #16161e

# ── 布局 ──────────────────────────────────
enabled_layouts splits,tall,fat,grid,stack

# ── Neovim 集成（smart-splits / kitty-scrollback）──
# socket-only：只允许经 Unix socket 遥控，不开放 TTY
allow_remote_control socket-only
listen_on unix:${HOME}/.cache/kitty/kitty-{kitty_pid}
shell_integration enabled

# ── 颜色主题：Tokyo Night（见 current-theme.conf）─────────────

# ── 快捷键 ────────────────────────────────
kitty_mod ctrl+shift

# ── 窗格导航（与 nvim smart-splits 共用 Ctrl-hjkl）──
# 焦点在 nvim 时交给 Neovim（插件会设 IS_NVIM）；否则切 Kitty 窗格
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l

# ── 窗口管理 ──────────────────────────────
map kitty_mod+enter     new_window_with_cwd
map kitty_mod+w         close_window
map kitty_mod+r         start_resizing_window
map kitty_mod+f         move_window_forward
map kitty_mod+]         next_window
map kitty_mod+[         previous_window
map kitty_mod+backslash launch --location=vsplit --cwd=current
map kitty_mod+apostrophe launch --location=hsplit --cwd=current

# 直接调整窗口大小（无需先进入 resize mode）
map kitty_mod+alt+h     resize_window narrower 5
map kitty_mod+alt+l     resize_window wider 5
map kitty_mod+alt+k     resize_window taller 3
map kitty_mod+alt+j     resize_window shorter 3
map kitty_mod+alt+left  resize_window narrower 5
map kitty_mod+alt+right resize_window wider 5
map kitty_mod+alt+up    resize_window taller 3
map kitty_mod+alt+down  resize_window shorter 3

# ── 布局切换 ──────────────────────────────
map kitty_mod+l         next_layout

# ── Tab 管理 ──────────────────────────────
map kitty_mod+t         new_tab_with_cwd
map kitty_mod+q         close_tab
map ctrl+tab            next_tab
map ctrl+shift+tab      previous_tab
map kitty_mod+1         goto_tab 1
map kitty_mod+2         goto_tab 2
map kitty_mod+3         goto_tab 3
map kitty_mod+4         goto_tab 4
map kitty_mod+5         goto_tab 5

# ── 字体大小 ──────────────────────────────
map kitty_mod+equal     change_font_size all +1.0
map kitty_mod+minus     change_font_size all -1.0
map kitty_mod+0         change_font_size all 0

# ── 复制粘贴 ──────────────────────────────
map kitty_mod+c         copy_to_clipboard
map kitty_mod+v         paste_from_clipboard
map kitty_mod+alt+c     launch --allow-remote-control --cwd=current /home/ivey/.config/ncmpcpp/bin/cover-art toggle

# ── 滚动 ──────────────────────────────────
map kitty_mod+up        scroll_line_up
map kitty_mod+down      scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end

# kitty-scrollback.nvim（路径在 lazy 安装之后才存在）
action_alias kitty_scrollback_nvim kitten ${HOME}/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py --nvim-args -u ${HOME}/setup/.config/nvim/kitty-scrollback-kitten.lua
map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# ── 搜索历史输出（需安装 fzf）──────────────
map kitty_mod+f2        launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i

# ── 透明度调节 ────────────────────────────
map kitty_mod+o>equal   set_background_opacity +0.05
map kitty_mod+o>minus   set_background_opacity -0.05
map kitty_mod+o>0       set_background_opacity 1.0

# ── 主题 & 配置 ───────────────────────────
map kitty_mod+i         kitten themes
map kitty_mod+F5        load_config_file


# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME

# 保留系统标题栏用于拖动窗口，同时让它跟随 kitty 背景色
wayland_titlebar_color background
